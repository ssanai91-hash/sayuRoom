<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사유의 방</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="experience.css">
<link rel="preload" href="assets/entrance-wall.webp" as="image" fetchpriority="high">
</head>
<body>

<canvas id="c" aria-label="사유의 방 3D 공간"></canvas>

<div id="gate">
  <small class="gate-version" lang="en">ver 0.10</small>
  <h1 class="sr-only">사유의 방 — A Room of Quiet Contemplation</h1>
  <div class="gate-visual" aria-hidden="true">
    <img class="gate-art" src="assets/entrance-wall.webp" width="1086" height="1448" alt="" fetchpriority="high" decoding="async">
  </div>
  <div class="gate-content">
    <p class="gate-intro"><span>어두운 방, 별빛 아래</span><span>두 반가사유상이 앉아 있습니다.</span><span>소리를 켜고 천천히 들어오세요.</span></p>
    <p id="modelStatus" role="status" aria-live="polite"></p>
    <button class="btn" id="retryModels" hidden>다시 불러오기</button>
    <button class="btn" id="enter" disabled>고요히 들어가기</button>
  </div>
</div>

<!-- 머무는 사람 수: 함께 있음 서버가 생기면 #presenceCount 숫자를 갱신한다 -->
<div id="presence" hidden>지금 <span id="presenceCount">0</span>명이 이곳에 머물고 있습니다.</div>
<div id="toast"></div>

<div id="pad" hidden>
  <div id="joy" role="application" aria-label="이동 조이스틱. 끄는 방향으로 걷습니다"><div id="knob"></div></div>
</div>

<div id="bar" hidden>
  <div class="row">
    <button id="bBow">절하기</button>
    <button id="bBow3">삼배</button>
    <span class="sep"></span>
    <button id="bMed">명상</button>
    <span class="sep"></span>
    <button id="bSnd" aria-pressed="true">소리</button>
  </div>
</div>

<div id="pick" hidden>
  <div class="box">
    <h2>명상</h2>
    <div class="opts">
      <button class="btn" data-min="3">3분</button>
      <button class="btn" data-min="10">10분</button>
      <button class="btn" data-min="20">20분</button>
    </div>
    <small>들숨 4초 · 날숨 6초에 맞춰 별빛이 숨 쉽니다</small>
    <button class="btn" id="pickCancel" style="border:0;font-size:13px;color:var(--dim)">돌아가기</button>
  </div>
</div>

<div id="medi">
  <div id="breath">들이쉬고</div>
  <div id="remain"></div>
  <button class="btn stop" id="mStop">명상 마치기</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="look-config.js"></script>
<script src="statue-models.js"></script>
<script src="statue-hq.js"></script>
<script src="room-environment.js"></script>
<script src="experience.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2.5));
renderer.outputEncoding=THREE.sRGBEncoding;

const scene=new THREE.Scene();
scene.background=new THREE.Color(SAYU_LOOK.room.background).convertSRGBToLinear();
const camera=new THREE.PerspectiveCamera(62,1,0.05,60);

const room=createSayuEnvironment({THREE,scene,renderer});
const starMat=room.starMaterial;
const statues=room.statues;
// 2단계: 다가가면 고화질(KTX2)로 교체. 고화질 파일이 없으면 조용히 2K 유지.
let hq=null,hqRequested=false,hqModels;
function loadNearbyHQ(){
  if(hqRequested||!hqModels||!statues.some(s=>Math.hypot(s.x-camera.position.x,s.z-camera.position.z)<6))return;
  hqRequested=true;
  if(new URLSearchParams(location.search).get('hq')==='off')return;
  const script=document.createElement('script');script.src='vendor/three-r128/ktx2-loader.r128.js';
  script.onload=()=>{
    hq=createSayuHQ({THREE,renderer,statues,isBusy:()=>$('#medi').classList.contains('on')||$('#bar').style.opacity==='0'});
    hqModels.forEach((model,i)=>hq.setModel(i,model));
  };
  document.head.appendChild(script);
}

const enter=document.querySelector('#enter');
enter.disabled=true;
const status=document.querySelector('#modelStatus');
async function prepareStatues(){
  enter.disabled=true;status.textContent='두 반가사유상을 모시는 중 · 0%';
  // models/models.json(아주 작음, 매번 확인)에 각 GLB의 내용 해시가 있다. 주소에 ?v=해시를 붙여
  // 한 번 받은 모델은 기기 보관함에서 바로 꺼내 쓰고, 모델이 바뀌면 해시가 바뀌어 새로 받는다.
  let list=[{file:'bangasayu-left.glb',bytes:7347092},{file:'bangasayu-right.glb',bytes:6451332}];
  try{const r=await fetch('models/models.json',{cache:'no-cache'});if(r.ok)list=(await r.json()).statues;}catch(_){}
  const urls=list.map(m=>'models/'+m.file+(m.sha256?'?v='+m.sha256.slice(0,8):''));
  const EST=list.map(m=>m.bytes||6500000),got=[0,0],tot=[0,0];
  const prog=i=>(g,t)=>{got[i]=g;tot[i]=t||EST[i];
    const all=tot[0]+tot[1]||EST[0]+EST[1],sum=got[0]+got[1];
    status.textContent='두 반가사유상을 모시는 중 · '+Math.min(99,Math.floor(sum/all*100))+'% ('+(sum/1048576).toFixed(1)+' / '+(all/1048576).toFixed(1)+'MB)';};
  try{
    const [left,right]=await Promise.all([loadSayuStatue(urls[0],prog(0)),loadSayuStatue(urls[1],prog(1))]);
    await room.ready;
    room.addStatue(left,0);room.addStatue(right,1);hqModels=[left,right];
    sayuPruneCache(urls);
    status.textContent='';enter.disabled=false;document.querySelector('#retryModels').hidden=true;
  }catch(error){status.textContent='불상을 불러오지 못했습니다 ('+(error&&error.message||error)+'). 다시 시도해 주세요.';document.querySelector('#retryModels').hidden=false;console.error(error);}
}
document.querySelector('#retryModels').addEventListener('click',prepareStatues);
prepareStatues();

const experience=createSayuExperience({THREE,canvas,camera,statues,roomSpec:room.spec,constrainPosition:room.constrainPosition,starBrightness:starMat.uniforms.uB,groundHeight:room.groundHeight});

let calibration=null;
async function syncCalibration(){
  if(location.hash==='#calib'){
    const {mountCalibration}=await import('./look-calibration.js');
    if(location.hash==='#calib'&&!calibration)calibration=mountCalibration(camera,room);
  }else if(calibration){calibration.close();calibration=null;}
}
addEventListener('hashchange',syncCalibration);
if(location.hash==='#calib')syncCalibration();

/* ---------- 루프 ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;
  // 작은 화면은 선명하게, 큰 화면은 전체 렌더 픽셀 수를 제한한다.
  const ratio=Math.min(window.devicePixelRatio||1,2.5,Math.sqrt(4500000/(w*h)));
  renderer.setPixelRatio(ratio);renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.fov=w<h?room.spec.view.portraitFov:room.spec.view.landscapeFov;camera.updateProjectionMatrix();
  starMat.uniforms.uPR.value=ratio;starMat.uniforms.uScale.value=h*ratio/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
}
addEventListener('resize',resize);resize();

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  experience.update(now,dt);
  if(calibration)calibration.update();
  if(hq)hq.update(camera.position,dt);else if(!hqRequested)loadNearbyHQ();
  starMat.uniforms.uT.value=now/1000;
  renderer.render(scene,camera);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<small id="credits">반가사유상 3D 데이터 © 국립중앙박물관 · 공공누리 제1유형 · GLB 변환·경량화</small>
</body>
</html>
